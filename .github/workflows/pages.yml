# イエノミクスを GitHub Pages に公開するための設定。
#
# なぜ自分で書くのか:
#   GitHub が自動で作る設定は Jekyll（ブログ生成ツール）を通してから公開する。
#   このアプリは HTML と JS をそのまま置くだけなので Jekyll は不要で、
#   しかも Jekyll のビルドが失敗すると公開が止まってしまう。
#   ここではファイルをそのまま上げるだけにして、失敗する余地をなくしている。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 米国市場の終了後（日本時間 朝6時・平日）に終値を取り直す
    - cron: '0 21 * * 1-5'
    # 日本時間 0:15 にニュースを取り直す（土日は学び記事）
    - cron: '15 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 連続で push したときは最後のものだけを公開する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 相場CSVを更新
        run: node tools/update-market.mjs
        continue-on-error: true

      - name: ニュースURLを更新
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node tools/update-news.mjs
        continue-on-error: true

      - name: Pages の設定を読み込む
        uses: actions/configure-pages@v5

      - name: ファイルをそのままアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 公開する
        id: deployment
        uses: actions/deploy-pages@v4
