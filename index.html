  <title>Chibiz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>

    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    input, select { outline: none; border-color: #111827; }
    input:focus, select:focus { box-shadow: 0 0 0 1px #111827; }
    .section-title { font-size: 0.875rem; font-weight: 700; color: #111827; margin-bottom: 0.75rem; margin-top: 2rem; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 4px; }
    input[type="checkbox"].accent-black { accent-color: #111827; }
  </style>
</head>
<body>

  <div class="app-container relative flex flex-col">
    <header class="px-6 py-4 flex justify-between items-center bg-white sticky top-0 z-10 border-b border-gray-50">
      <h1 class="text-xl font-extrabold tracking-tight text-gray-900">Chibiz</h1>
      <div id="header-actions"></div>
    </header>
    
    <main class="flex-1 px-6 pb-10 overflow-y-auto" id="app">
      <div class="text-center py-10 text-gray-400 text-sm">Loading...</div>
    </main>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, where, updateDoc, doc, setDoc, getDoc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTUuPPXrZqVyGtri1HT6L7Uaow3-0OgXLzVsxkWRPSp12tqCFhPW8yIuJDpFNgWwNHlrKWemte6Kfqt/pub?output=csv";

    const firebaseConfig = {
      apiKey: "AIzaSyA57yXg46NjGVue3WUK-jbZ68hwQwdLA-g",
      authDomain: "tibiz-a395e.firebaseapp.com",
      projectId: "tibiz-a395e",
      storageBucket: "tibiz-a395e.firebasestorage.app",
      messagingSenderId: "347209039114",
      appId: "1:347209039114:web:0d3ff0477e7bb812210ef3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let state = {
      role: localStorage.getItem('chibiz_role'),
      familyCode: localStorage.getItem('chibiz_familyCode'),
      notify: localStorage.getItem('chibiz_notify') === 'true',
      view: 'main', 
      points: 0,
      tasks: [],
      tickets: [],
      scheduledTasks: [],
      funds: [],
      investments: []
    };

    const appDiv = document.getElementById('app');
    const headerActions = document.getElementById('header-actions');
    const days = ["日", "月", "火", "水", "木", "金", "土"];

    const gearIcon = `<button onclick="toggleSettings()" class="text-gray-400 hover:text-gray-800 transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg></button>`;
    const closeIcon = `<button onclick="toggleSettings()" class="text-gray-400 hover:text-gray-800 transition"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" /></svg></button>`;

    const renderPointCard = () => `
      <div class="bg-[#111625] text-white rounded-xl p-6 flex justify-between items-center mb-6 mt-2 shadow-lg">
        <div>
          <p class="text-[10px] text-gray-400 mb-1">現在のポイント</p>
          <p class="text-4xl font-bold">${state.points.toLocaleString()} <span class="text-sm font-normal text-gray-400">pt</span></p>
        </div>
        <div class="border-l border-gray-700 pl-5">
          <p class="text-[10px] text-gray-400 mb-1">同期コード</p>
          <p class="text-base font-mono font-bold tracking-widest text-blue-300">${state.familyCode}</p>
        </div>
      </div>
    `;

    function formatDays(daysData) {
      let arr = Array.isArray(daysData) ? daysData : [parseInt(daysData)];
      arr.sort((a, b) => a - b);
      if (arr.length === 7) return "毎日";
      if (arr.length === 5 && arr.join(',') === "1,2,3,4,5") return "平日(月-金)";
      if (arr.length === 2 && arr.join(',') === "0,6") return "土日";
      return arr.map(d => days[d]).join('・');
    }

    function render() {
      if (!state.role || !state.familyCode) renderSetup();
      else if (state.view === 'settings') renderSettings();
      else if (state.role === 'parent') renderParent();
      else if (state.role === 'child') renderChild();
    }

    function renderSetup() {
      headerActions.innerHTML = '';
      appDiv.innerHTML = `
        <div class="fade-in space-y-6 mt-6">
          <div class="space-y-4">
            <div class="p-6 border border-gray-100 rounded-xl bg-gray-50">
              <h3 class="font-bold text-sm mb-3">親としてスタート</h3>
              <button id="btn-create-parent" class="w-full bg-black text-white py-3 rounded-lg text-sm font-bold shadow-sm">同期コードを発行</button>
            </div>
            <div class="p-6 border border-gray-100 rounded-xl bg-gray-50">
              <h3 class="font-bold text-sm mb-3">子供としてスタート</h3>
              <input type="text" id="input-family-code" placeholder="コードを入力" class="w-full p-3 border border-gray-200 rounded-lg mb-3 text-center font-mono uppercase text-sm" />
              <button id="btn-join-child" class="w-full bg-blue-600 text-white py-3 rounded-lg text-sm font-bold shadow-sm">連携して開始</button>
            </div>
          </div>
        </div>
      `;

      document.getElementById('btn-create-parent').addEventListener('click', async () => {
        const code = Math.random().toString(36).substring(2, 8).toUpperCase();
        await setDoc(doc(db, "families", code), { points: 0 });
        localStorage.setItem('chibiz_role', 'parent'); localStorage.setItem('chibiz_familyCode', code);
        state.role = 'parent'; state.familyCode = code; setupListeners();
      });

      document.getElementById('btn-join-child').addEventListener('click', async () => {
        const code = document.getElementById('input-family-code').value.toUpperCase().trim();
        if (!code) return;
        const docSnap = await getDoc(doc(db, "families", code));
        if (docSnap.exists()) {
          localStorage.setItem('chibiz_role', 'child'); localStorage.setItem('chibiz_familyCode', code);
          state.role = 'child'; state.familyCode = code; setupListeners();
        } else alert("正しいコードが見つかりません。");
      });
    }

    function renderSettings() {
      headerActions.innerHTML = closeIcon;
      const approvedTasks = state.tasks.filter(t => t.status === 'approved');
      const totalEarned = approvedTasks.reduce((sum, t) => sum + t.points, 0);

      if (state.role === 'child') {
        appDiv.innerHTML = `
          <div class="fade-in space-y-6 mt-2">
            <h2 class="text-lg font-bold text-gray-900 border-b pb-2">設定</h2>
            
            <div class="p-5 border border-gray-100 rounded-xl bg-gray-50">
              <p class="text-xs text-gray-500 mb-1">これまでの累計獲得</p>
              <p class="text-2xl font-bold text-gray-900 mb-4">${totalEarned.toLocaleString()} pt</p>
              <h4 class="text-xs font-bold text-gray-400 mb-2">完了した仕事</h4>
              <div class="max-h-40 overflow-y-auto space-y-1">
                ${approvedTasks.length > 0 ? approvedTasks.map(t => `<div class="flex justify-between text-sm py-2 border-b border-gray-100"><span class="text-gray-700">${t.title}</span><span class="text-gray-500">${t.points}pt</span></div>`).join('') : '<p class="text-xs text-gray-400">まだありません</p>'}
              </div>
            </div>

            <div class="flex justify-between items-center p-4 border border-gray-100 rounded-xl bg-gray-50">
              <span class="text-sm font-bold text-gray-700">プッシュ通知を受け取る</span>
              <input type="checkbox" onchange="toggleNotify(this.checked)" class="w-5 h-5 rounded accent-black cursor-pointer" ${state.notify ? 'checked' : ''} />
            </div>

            <div class="pt-4">
              <button onclick="unlinkAccount()" class="w-full bg-white border border-red-200 text-red-500 py-3 rounded-lg text-sm font-bold">連携を解除</button>
            </div>
          </div>
        `;
      } else {
        appDiv.innerHTML = `
          <div class="fade-in space-y-6 mt-2">
            <h2 class="text-lg font-bold text-gray-900 border-b pb-2">設定</h2>
            
            <div class="p-5 border border-gray-100 rounded-xl bg-gray-50">
              <h3 class="text-sm font-bold text-gray-800 mb-3">スケジュール管理 (定期的な仕事)</h3>
              <p class="text-xs text-gray-500 mb-3">新しいスケジュールはメイン画面から「毎週繰り返す」で追加できます。</p>
              <div class="space-y-2 mt-4">
                ${state.scheduledTasks.length > 0 ? state.scheduledTasks.map(st => `
                  <div class="flex justify-between items-center p-3 bg-white border border-gray-100 rounded text-sm shadow-sm">
                    <div>
                      <span class="font-bold text-gray-800">${st.title}</span> <span class="text-gray-500 ml-2 text-xs">${st.points}pt</span>
                      <p class="text-xs text-blue-600 font-bold mt-1">毎週: ${formatDays(st.dayOfWeek)} ${st.time}</p>
                    </div>
                    <button onclick="deleteSchedule('${st.id}')" class="text-xs text-red-500 bg-red-50 px-3 py-1 rounded">削除</button>
                  </div>
                `).join('') : '<p class="text-xs text-gray-400 text-center py-2">登録されたスケジュールはありません</p>'}
              </div>
            </div>

            <div class="p-5 border border-gray-100 rounded-xl bg-gray-50">
              <p class="text-xs text-gray-500 mb-1">同期コード</p>
              <p class="text-xl font-mono font-bold tracking-widest text-blue-600">${state.familyCode}</p>
            </div>
            
            <div class="pt-4">
              <button onclick="unlinkAccount()" class="w-full bg-white border border-red-200 text-red-500 py-3 rounded-lg text-sm font-bold">連携を解除</button>
            </div>
          </div>
        `;
      }
    }

    function renderParent() {
      headerActions.innerHTML = gearIcon;
      const proposedTasks = state.tasks.filter(t => t.status === 'proposed');
      const activeTasks = state.tasks.filter(t => ['open', 'accepted', 'completed'].includes(t.status));
      const activeTickets = state.tickets.filter(t => t.status !== 'used');
      const boughtTickets = activeTickets.filter(t => t.status === 'bought');

      appDiv.innerHTML = `
        <div class="fade-in">
          ${renderPointCard()}

          ${proposedTasks.length > 0 ? `
            <div class="mb-8 p-4 border border-blue-200 bg-blue-50 rounded-xl shadow-sm">
              <h2 class="text-xs font-bold text-blue-800 mb-3">子供からの見積り・提案</h2>
              ${proposedTasks.map(t => `
                <div class="flex flex-col gap-2 bg-white p-3 rounded-lg shadow-sm mb-2 border border-blue-100">
                  <div class="flex justify-between items-center">
                    <span class="text-sm font-bold text-gray-800">${t.title}</span>
                    <span class="text-sm font-bold text-blue-600">${t.points} pt</span>
                  </div>
                  <div class="flex gap-2 mt-1">
                    <button onclick="approveProposal('${t.id}')" class="flex-1 bg-black text-white text-xs py-2 rounded font-bold">承認して依頼</button>
                    <button onclick="rejectProposal('${t.id}')" class="flex-1 bg-gray-100 text-gray-600 text-xs py-2 rounded font-bold">却下</button>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : ''}

          ${state.investments.length > 0 ? `
            <h2 class="section-title">子供の投資状況</h2>
            <div class="space-y-2 mb-8">
              ${state.investments.map(inv => {
                const fundData = state.funds.find(f => f.name === inv.name);
                const changePct = fundData ? fundData.changePct : 0;
                const currentValue = Math.round(inv.investedPoints * (1 + changePct / 100));
                const isUp = changePct >= 0;
                return `
                  <div class="flex justify-between items-center p-4 border border-gray-200 rounded-lg bg-white shadow-sm">
                    <div>
                      <p class="text-sm font-bold text-gray-800">${inv.name}</p>
                      <p class="text-xs text-gray-500 mt-1">投資額: ${inv.investedPoints} pt</p>
                    </div>
                    <div class="text-right">
                      <p class="text-sm font-bold text-gray-800">現在値: ${currentValue.toLocaleString()} pt</p>
                      <p class="text-xs font-bold mt-1 ${isUp ? 'text-red-500' : 'text-blue-500'}">${isUp ? '▲' : '▼'} ${Math.abs(changePct)}%</p>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : ''}

          <h2 class="section-title">新しい仕事を依頼</h2>
          <div class="flex gap-2 mb-3">
            <input type="text" id="task-title" placeholder="仕事のタイトル" class="flex-1 p-3 text-sm border border-gray-200 rounded-lg" />
            <input type="number" id="task-points" placeholder="pt" class="w-20 p-3 text-sm border border-gray-200 rounded-lg text-center" />
          </div>
          
          <div class="flex items-center gap-2 mb-3 px-1">
            <input type="checkbox" id="task-is-weekly" onchange="toggleWeeklyOptions()" class="w-4 h-4 accent-black cursor-pointer" />
            <label for="task-is-weekly" class="text-sm font-medium text-gray-700 cursor-pointer">毎週繰り返す (スケジュール)</label>
          </div>

          <div id="weekly-options" class="hidden flex-col gap-4 mb-4 p-4 bg-gray-50 border border-gray-200 rounded-lg">
            <div>
              <p class="text-xs text-gray-500 font-bold mb-2">繰り返す曜日 (複数選択可)</p>
              <div class="flex justify-between items-center">
                ${days.map((d, i) => `<button type="button" data-day="${i}" onclick="toggleDayBtn(this)" class="day-btn w-10 h-10 rounded-full text-xs font-bold transition-colors border border-gray-200 bg-white text-gray-400">${d}</button>`).join('')}
              </div>
            </div>
            <div>
              <p class="text-xs text-gray-500 font-bold mb-2">追加する時間</p>
              <input type="time" id="task-time" class="w-full p-3 text-sm border border-gray-200 rounded-lg bg-white" />
            </div>
          </div>

          <button onclick="addTask()" class="w-full bg-black text-white py-3 rounded-lg text-sm font-bold mb-8 shadow">依頼を追加する</button>

          <h2 class="section-title">管理リスト</h2>
          <div class="space-y-2 mb-8">
            ${activeTasks.length > 0 ? activeTasks.map(t => `
              <div class="flex justify-between items-center p-4 border border-gray-100 rounded-lg bg-white">
                <div>
                  <p class="text-sm font-bold text-gray-800">${t.title}</p>
                  <p class="text-xs text-gray-500 mt-1">${t.points} pt</p>
                </div>
                <div>
                  ${t.status === 'completed' ? `<button onclick="approveTask('${t.id}', ${t.points})" class="bg-blue-600 text-white text-xs px-4 py-2 rounded font-bold shadow-sm">確認・pt付与</button>` : 
                    t.status === 'accepted' ? `<span class="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded font-medium">子供が作業中</span>` : 
                    `<span class="text-xs text-gray-400">未受注</span>`}
                </div>
              </div>
            `).join('') : `<div class="border border-dashed border-gray-200 rounded-lg p-6 text-center text-xs text-gray-400">管理する仕事はありません</div>`}
          </div>

          <h2 class="section-title">チケット販売所</h2>
          ${boughtTickets.length > 0 ? `
            <div class="mb-4">
              <p class="text-xs font-bold text-gray-500 mb-2">子供が使いたがっています</p>
              ${boughtTickets.map(t => `
                <div class="flex justify-between items-center p-3 mb-2 bg-gray-900 text-white rounded-lg">
                  <span class="text-sm font-bold">${t.title}</span>
                  <button onclick="useTicket('${t.id}')" class="bg-white text-black text-xs px-3 py-1.5 rounded font-bold">回収する (使用済)</button>
                </div>
              `).join('')}
            </div>
          ` : ''}

          <div class="flex gap-2 mb-3">
            <input type="text" id="ticket-title" placeholder="チケット名 (例: ゲーム30分)" class="flex-1 p-3 text-sm border border-gray-200 rounded-lg" />
            <input type="number" id="ticket-points" placeholder="pt" class="w-20 p-3 text-sm border border-gray-200 rounded-lg text-center" />
          </div>
          <button onclick="addTicket()" class="w-full border border-gray-300 bg-white text-gray-800 py-3 rounded-lg text-sm font-bold mb-4 shadow-sm">販売リストに追加</button>
          
          <div class="space-y-2">
            ${activeTickets.filter(t => t.status === 'available').map(t => `
              <div class="flex justify-between items-center p-4 border border-gray-100 rounded-lg bg-gray-50">
                <span class="text-sm font-bold text-gray-800">${t.title} <span class="text-xs text-gray-500 font-normal ml-2">${t.price} pt</span></span>
                <button onclick="deleteTicket('${t.id}')" class="text-xs text-red-500 font-medium">販売やめる</button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderChild() {
      headerActions.innerHTML = gearIcon;
      const activeTasks = state.tasks.filter(t => ['open', 'accepted', 'completed', 'proposed'].includes(t.status));
      const activeTickets = state.tickets.filter(t => t.status !== 'used');

      appDiv.innerHTML = `
        <div class="fade-in">
          ${renderPointCard()}

          <h2 class="section-title">親に仕事を提案・見積りする</h2>
          <div class="flex gap-2 mb-3">
            <input type="text" id="prop-title" placeholder="これをやるよ！" class="flex-1 p-3 text-sm border border-gray-200 rounded-lg" />
            <input type="number" id="prop-points" placeholder="pt" class="w-20 p-3 text-sm border border-gray-200 rounded-lg text-center" />
          </div>
          <button onclick="proposeTask()" class="w-full border border-blue-200 bg-blue-50 text-blue-700 py-3 rounded-lg text-sm font-bold mb-8 shadow-sm">提案を送る</button>

          <h2 class="section-title">おてつだいリスト</h2>
          <div class="space-y-2 mb-8">
            ${activeTasks.length > 0 ? activeTasks.map(t => `
              <div class="flex justify-between items-center p-4 border border-gray-100 rounded-lg bg-white shadow-sm">
                <div>
                  <p class="text-sm font-bold text-gray-800">${t.title}</p>
                  <p class="text-xs text-gray-500 mt-1">${t.points} pt</p>
                </div>
                <div>
                  ${t.status === 'open' ? `<button onclick="acceptTask('${t.id}')" class="bg-black text-white text-xs px-4 py-2 rounded font-bold">受注する</button>` : 
                    t.status === 'accepted' ? `<button onclick="completeTask('${t.id}')" class="border border-black text-black text-xs px-4 py-2 rounded font-bold">完了報告</button>` : 
                    t.status === 'proposed' ? `<span class="text-xs text-blue-500 bg-blue-50 px-2 py-1 rounded font-bold">親の確認待ち</span>` :
                    `<span class="text-xs text-gray-400 font-bold">親の確認待ち</span>`}
                </div>
              </div>
            `).join('') : `<div class="border border-dashed border-gray-200 rounded-lg p-6 text-center text-xs text-gray-400">いまできる仕事はありません</div>`}
          </div>

          <h2 class="section-title border-t-2 pt-6 border-gray-100">📈 投資（現実の市場に連動）</h2>
          
          <div class="mb-6">
            <p class="text-xs text-gray-500 font-bold mb-2">運用中のファンド</p>
            ${state.investments.length > 0 ? state.investments.map(inv => {
              const fundData = state.funds.find(f => f.name === inv.name);
              const changePct = fundData ? fundData.changePct : 0;
              const currentValue = Math.round(inv.investedPoints * (1 + changePct / 100));
              const diff = currentValue - inv.investedPoints;
              const isUp = diff >= 0;
              const sign = isUp ? "▲" : "▼";
              const color = isUp ? "text-red-500" : "text-blue-500";
              const diffStr = `<span class="${color}">${sign} ${Math.abs(diff)} pt</span>`;

              return `
                <div class="flex justify-between items-center p-4 bg-white border border-gray-100 rounded-lg mb-2 shadow-sm">
                  <div>
                    <p class="text-sm font-bold text-gray-800">${inv.name}</p>
                    <p class="text-xs text-gray-500 mt-1">投資額: ${inv.investedPoints} pt</p>
                    <p class="text-xs font-bold text-gray-800 mt-1">今の価値: ${currentValue.toLocaleString()} pt (${diffStr})</p>
                  </div>
                  <button onclick="sellFund('${inv.id}', '${inv.name}', ${currentValue})" class="text-xs bg-gray-100 text-gray-800 px-4 py-2 rounded font-bold transition hover:bg-gray-200">売却してptに戻す</button>
                </div>
              `;
            }).join('') : '<p class="text-xs text-gray-400 border border-dashed border-gray-200 rounded-lg p-4 text-center">まだ投資していません</p>'}
          </div>

          <div class="mb-8">
            <p class="text-xs text-gray-500 font-bold mb-2">市場に投資する</p>
            <div class="space-y-2">
              ${state.funds.length > 0 ? state.funds.map(fund => {
                const isUp = fund.changePct >= 0;
                const sign = isUp ? "▲" : "▼";
                const color = isUp ? "text-red-500" : "text-blue-500";
                
                return `
                  <div class="flex justify-between items-center p-4 border border-gray-100 bg-white rounded-lg shadow-sm">
                    <div>
                      <span class="text-sm font-bold text-gray-800">${fund.name}</span>
                      <span class="text-sm font-bold ${color} ml-2">${sign} ${Math.abs(fund.changePct)}%</span>
                    </div>
                    <button onclick="investFund('${fund.name}', 100)" class="bg-black text-white text-xs px-4 py-2 rounded font-bold shadow-sm">100pt 投資する</button>
                  </div>
                `;
              }).join('') : '<p class="text-xs text-gray-400 p-4 text-center">市場データを読み込み中...</p>'}
            </div>
            <p class="text-[10px] text-gray-400 mt-2 text-right">※市場の変動（％）に応じて、投資したポイントが増減します。</p>
          </div>

          <h2 class="section-title border-t-2 pt-6 border-gray-100">チケット交換所</h2>
          <div class="space-y-2">
            ${activeTickets.length > 0 ? activeTickets.map(t => `
              <div class="flex justify-between items-center p-4 border ${t.status === 'bought' ? 'border-gray-800 bg-gray-900 text-white' : 'border-gray-100 bg-white'} rounded-lg shadow-sm">
                <div>
                  <p class="text-sm font-bold ${t.status === 'bought' ? 'text-white' : 'text-gray-800'}">${t.title}</p>
                  <p class="text-xs ${t.status === 'bought' ? 'text-gray-400' : 'text-gray-500'} mt-1">${t.price} pt</p>
                </div>
                <div>
                  ${t.status === 'available' ? `<button onclick="buyTicket('${t.id}', ${t.price})" class="bg-gray-100 text-gray-800 text-xs px-4 py-2 rounded font-bold shadow-sm">交換する</button>` : 
                    `<span class="text-xs font-bold px-3 py-1 bg-white text-black rounded shadow-sm">親に見せて使う</span>`}
                </div>
              </div>
            `).join('') : `<div class="border border-dashed border-gray-200 rounded-lg p-6 text-center text-xs text-gray-400">販売中のチケットはありません</div>`}
          </div>
        </div>
      `;
    }

    // ==========================================
    // アクション・ロジック
    // ==========================================
    window.toggleSettings = () => { state.view = state.view === 'settings' ? 'main' : 'settings'; render(); };
    window.unlinkAccount = () => { if (confirm("連携を解除しますか？")) { localStorage.clear(); window.location.reload(); } };
    
    window.toggleNotify = (val) => { 
      state.notify = val; 
      localStorage.setItem('chibiz_notify', val);
      if (val && Notification.permission !== "granted") {
        Notification.requestPermission();
      }
    };

    window.toggleWeeklyOptions = () => { document.getElementById('weekly-options').classList.toggle('hidden'); document.getElementById('weekly-options').classList.toggle('flex'); };
    window.toggleDayBtn = (btn) => {
      btn.classList.toggle('selected');
      if (btn.classList.contains('selected')) {
        btn.className = "day-btn selected w-10 h-10 rounded-full text-xs font-bold transition-colors bg-gray-900 border-gray-900 text-white";
      } else {
        btn.className = "day-btn w-10 h-10 rounded-full text-xs font-bold transition-colors bg-white border-gray-200 text-gray-400";
      }
    };

    window.addTask = async () => {
      const title = document.getElementById('task-title').value.trim();
      const points = parseInt(document.getElementById('task-points').value);
      const isWeekly = document.getElementById('task-is-weekly').checked;
      if (!title || !points || points <= 0) return alert("タイトルとポイントを正しく入力してください");
      if (isWeekly) {
        const selectedDays = Array.from(document.querySelectorAll('.day-btn.selected')).map(b => parseInt(b.dataset.day));
        if (selectedDays.length === 0) return alert("曜日を1つ以上選択してください");
        const time = document.getElementById('task-time').value;
        if (!time) return alert("時間を設定してください");
        
        await addDoc(collection(db, "scheduledTasks"), { familyCode: state.familyCode, title, points, dayOfWeek: selectedDays, time, createdAt: Date.now() });
        alert("毎週のスケジュールに追加しました！");
      } else {
        await addDoc(collection(db, "tasks"), { familyCode: state.familyCode, title, points, status: 'open', createdAt: Date.now() });
      }
      
      document.getElementById('task-title').value = '';
      document.getElementById('task-points').value = '';
      document.getElementById('task-is-weekly').checked = false;
      document.getElementById('weekly-options').classList.add('hidden');
      document.getElementById('weekly-options').classList.remove('flex');
      document.querySelectorAll('.day-btn').forEach(b => { b.className = "day-btn w-10 h-10 rounded-full text-xs font-bold transition-colors bg-white border-gray-200 text-gray-400"; });
    };

    window.deleteSchedule = async (id) => deleteDoc(doc(db, "scheduledTasks", id));
    window.approveTask = async (id, points) => { await updateDoc(doc(db, "tasks", id), { status: 'approved' }); await updateDoc(doc(db, "families", state.familyCode), { points: increment(points) }); };
    window.proposeTask = async () => {
      const title = document.getElementById('prop-title').value.trim();
      const points = parseInt(document.getElementById('prop-points').value);
      if (title && points > 0) {
        await addDoc(collection(db, "tasks"), { familyCode: state.familyCode, title, points, status: 'proposed', createdAt: Date.now() });
        alert("親に見積り・提案を送りました！");
        document.getElementById('prop-title').value = '';
        document.getElementById('prop-points').value = '';
      }
    };
    window.approveProposal = async (id) => updateDoc(doc(db, "tasks", id), { status: 'open' });
    window.rejectProposal = async (id) => deleteDoc(doc(db, "tasks", id));
    window.acceptTask = async (id) => updateDoc(doc(db, "tasks", id), { status: 'accepted' });
    window.completeTask = async (id) => updateDoc(doc(db, "tasks", id), { status: 'completed' });

    window.addTicket = async () => {
      const title = document.getElementById('ticket-title').value.trim();
      const price = parseInt(document.getElementById('ticket-points').value);
      if (title && price > 0) {
        await addDoc(collection(db, "tickets"), { familyCode: state.familyCode, title, price, status: 'available', createdAt: Date.now() });
        document.getElementById('ticket-title').value = '';
        document.getElementById('ticket-points').value = '';
      }
    };
    window.deleteTicket = async (id) => deleteDoc(doc(db, "tickets", id));
    window.buyTicket = async (id, price) => {
      if (state.points < price) return alert("ポイントが足りません");
      await updateDoc(doc(db, "tickets", id), { status: 'bought' });
      await updateDoc(doc(db, "families", state.familyCode), { points: increment(-price) });
    };
    window.useTicket = async (id) => updateDoc(doc(db, "tickets", id), { status: 'used' });

    window.investFund = async (name, amount) => {
      if (state.points < amount) return alert("ポイントが足りません！\n（100pt必要です）");
      if (confirm(`【${name}】の市場に ${amount}pt を投資しますか？`)) {
        await updateDoc(doc(db, "families", state.familyCode), { points: increment(-amount) });
        const existingInv = state.investments.find(inv => inv.name === name);
        if (existingInv) {
          await updateDoc(doc(db, "investments", existingInv.id), { investedPoints: increment(amount) });
        } else {
          await addDoc(collection(db, "investments"), { familyCode: state.familyCode, name: name, investedPoints: amount, createdAt: Date.now() });
        }
        alert("投資が完了しました！");
      }
    };

    window.sellFund = async (id, name, currentValue) => {
      if (currentValue === 0) return alert("市場データが読み込めていません");
      if (confirm(`【${name}】の投資を終了し、\n今の価値である『${currentValue}pt』を受け取りますか？`)) {
        await updateDoc(doc(db, "families", state.familyCode), { points: increment(currentValue) });
        await deleteDoc(doc(db, "investments", id));
        alert(`投資を終了し、${currentValue}pt を受け取りました！`);
      }
    };

    async function fetchFunds() {
      if (!SPREADSHEET_CSV_URL) return;
      try {
        const response = await fetch(SPREADSHEET_CSV_URL);
        const csvText = await response.text();
        const lines = csvText.split('\n').filter(line => line.trim() !== '');
        const parsedFunds = [];
        lines.forEach(line => {
          const cols = line.split(',');
          if (cols.length >= 2) {
            const name = cols[0].trim();
            const changePct = parseFloat(cols[1].trim());
            if (!isNaN(changePct) && name) parsedFunds.push({ name, changePct });
          }
        });
        state.funds = parsedFunds;
        render();
      } catch(e) { console.error("市場データの取得に失敗しました", e); }
    }

    // ==========================================
    // 定期実行と通知ロジック (修正ポイント)
    // ==========================================
    function sendNotification(title, body) {
      if (state.notify && Notification.permission === "granted") {
        new Notification(title, { body: body });
      }
    }

    async function checkScheduledTasks() {
      if (!state.familyCode || state.scheduledTasks.length === 0) return;
      const now = new Date();
      const currentDay = now.getDay();
      const currentHour = now.getHours();
      const currentMin = now.getMinutes();

      for (const st of state.scheduledTasks) {
        const daysArr = Array.isArray(st.dayOfWeek) ? st.dayOfWeek : [parseInt(st.dayOfWeek)];
        if (daysArr.includes(currentDay)) {
          const [h, m] = st.time.split(':').map(Number);
          // 指定時間以降かチェック
          if (currentHour > h || (currentHour === h && currentMin >= m)) {
            const lastGenDate = st.lastGenerated ? new Date(st.lastGenerated).toDateString() : null;
            const todayDate = now.toDateString();
            
            if (lastGenDate !== todayDate) {
              // タスク追加
              await addDoc(collection(db, "tasks"), { 
                familyCode: state.familyCode, 
                title: st.title, 
                points: st.points, 
                status: 'open', 
                createdAt: Date.now() 
              });
              // 生成済みフラグ更新
              await updateDoc(doc(db, "scheduledTasks", st.id), { lastGenerated: Date.now() });
              
              if (state.role === 'child') {
                sendNotification("新しいお仕事！", `定期タスク「${st.title}」が追加されました。`);
              }
            }
          }
        }
      }
    }

    setInterval(checkScheduledTasks, 30000); // 30秒ごとにチェック
    setInterval(fetchFunds, 60000);

    function setupListeners() {
      if (!state.familyCode) return;
      onSnapshot(doc(db, "families", state.familyCode), (doc) => {
        if (doc.exists()) { state.points = doc.data().points || 0; render(); }
      });
      const watch = (colName, stateKey) => {
        const q = query(collection(db, colName), where("familyCode", "==", state.familyCode));
        onSnapshot(q, (snapshot) => {
          const arr = []; snapshot.forEach(d => arr.push({ id: d.id, ...d.data() }));
          arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          state[stateKey] = arr; render();
          if (colName === 'scheduledTasks') checkScheduledTasks(); // データ更新時にも即座にチェック
        });
      };
      watch("tasks", "tasks");
      watch("tickets", "tickets");
      watch("investments", "investments");
      watch("scheduledTasks", "scheduledTasks");
      
      fetchFunds();
    }

    if (state.familyCode) setupListeners(); else render();
  </script>
</body>
</html>
