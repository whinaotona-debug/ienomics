<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chibiz (Tech Kids Grand Prix Ver.)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0fdf4; color: #111; padding-bottom: 6rem; }
    /* ネオブルータリズム風のポップなデザイン設定 */
    .card-box { border: 3px solid #111; border-radius: 8px; background: #ffffff; box-shadow: 4px 4px 0 #111; }
    .btn-box { border: 3px solid #111; border-radius: 8px; background: #ffffff; box-shadow: 3px 3px 0 #111; transition: transform 0.1s, box-shadow 0.1s; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .btn-box:active { transform: translate(3px, 3px); box-shadow: 0 0 0 #111; }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-yellow { background: #fde047; color: #111; }
    
    .nav-btn { width: 4.5rem; height: 4.5rem; border: 3px solid #111; border-radius: 50%; font-weight: 800; display: flex; align-items: center; justify-content: center; background: #fff; transition: all 0.2s; font-size: 0.9rem; }
    .nav-btn.active { background: #111; color: #fff; }
    
    .fade-in { animation: fadeIn 0.3s ease-out forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #111; border-radius: 10px; }
  </style>
</head>
<body>

  <div id="app" class="max-w-[800px] mx-auto pt-6 px-4">
    <div class="text-center py-20 font-bold text-xl">Loading...</div>
  </div>
  
  <nav id="bottom-nav" class="fixed bottom-0 left-0 w-full bg-white border-t-4 border-black z-50 py-3 hidden">
    <!-- JSでレンダリングされます -->
  </nav>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, where, updateDoc, doc, setDoc, getDoc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA57yXg46NjGVue3WUK-jbZ68hwQwdLA-g",
      authDomain: "tibiz-a395e.firebaseapp.com",
      projectId: "tibiz-a395e",
      storageBucket: "tibiz-a395e.firebasestorage.app",
      messagingSenderId: "347209039114",
      appId: "1:347209039114:web:0d3ff0477e7bb812210ef3"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let investChartInstance = null; 

    let state = {
      role: localStorage.getItem('chibiz_role'),
      familyCode: localStorage.getItem('chibiz_familyCode'),
      view: 'home', // 'home', 'propose', 'taskCreate', 'exchange', 'shop', 'invest', 'tickets', 'history', 'settings'
      points: 0,
      tasks: [],
      tickets: [],
      investments: [],
      exchanges: []
    };

    const appDiv = document.getElementById('app');
    const bottomNav = document.getElementById('bottom-nav');

    // ★ グラフ用のデータ（過去半年分）
    function getMarketRates() {
      const today = new Date();
      const rates = { 日本: [], アメリカ: [], labels: [] };
      for (let i = 12; i >= 0; i--) {
        const d = new Date(today.getTime() - i * 15 * 86400000);
        rates.labels.push(`${d.getMonth()+1}/${d.getDate()}`);
        const day = Math.floor(d.getTime() / 86400000);
        const rateJp = 1.0 + Math.sin(day * 0.1) * 0.2 + Math.sin(day * 0.03) * 0.3; 
        const rateAm = 1.0 + Math.cos(day * 0.08) * 0.3 + Math.sin(day * 0.04) * 0.4;
        rates.日本.push(Math.max(0.1, rateJp)); 
        rates.アメリカ.push(Math.max(0.1, rateAm));
      }
      return rates;
    }

    // ★ 期日の計算関数
    function formatTimeLeft(deadlineTime) {
      if (!deadlineTime) return '<span class="text-gray-400">期日なし</span>';
      const diff = deadlineTime - Date.now();
      if (diff < 0) return '<span class="text-red-500 font-bold">期限切れ</span>';
      
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      if (days > 0) return `あと${days}日`;
      const hours = Math.floor(diff / (1000 * 60 * 60));
      if (hours > 0) return `あと${hours}時間`;
      const minutes = Math.floor(diff / (1000 * 60));
      return `あと${minutes}分`;
    }

    window.setView = (viewName) => {
      state.view = viewName;
      render();
    };

    function render() {
      if (!state.role || !state.familyCode) {
        bottomNav.classList.add('hidden');
        renderSetup();
        return;
      }

      bottomNav.classList.remove('hidden');
      bottomNav.innerHTML = `
        <div class="max-w-[800px] w-full mx-auto flex justify-around px-2">
          <button onclick="setView('home')" class="nav-btn ${state.view==='home'?'active':''}">ホーム</button>
          <button onclick="setView('tickets')" class="nav-btn ${state.view==='tickets'?'active':''}">チケット</button>
          <button onclick="setView('settings')" class="nav-btn ${state.view==='settings'?'active':''}">設定</button>
          <button onclick="setView('history')" class="nav-btn ${state.view==='history'?'active':''}">りれき</button>
        </div>
      `;

      let html = renderHeader();

      switch(state.view) {
        case 'home': html += renderHome(); break;
        case 'propose': html += renderPropose(); break;
        case 'taskCreate': html += renderTaskCreate(); break;
        case 'exchange': html += renderExchange(); break;
        case 'shop': html += renderShop(); break;
        case 'invest': html += renderInvest(); break;
        case 'tickets': html += renderTickets(); break;
        case 'history': html += renderHistory(); break;
        case 'settings': html += renderSettings(); break;
      }

      appDiv.innerHTML = `<div class="fade-in">${html}</div>`;

      if (state.view === 'home' || state.view === 'invest') {
        setTimeout(drawInvestChart, 100);
      }
    }

    function renderHeader() {
      return `
        <div class="bg-[#111] text-white p-5 rounded-xl flex justify-between items-center mb-6 shadow-lg">
          <div>
            <p class="text-[10px] text-gray-400 mb-1">現在のコイン</p>
            <p class="text-4xl font-black">${state.points.toLocaleString()} <span class="text-sm font-normal text-gray-400">コイン</span></p>
          </div>
          <div class="border-l-2 border-gray-700 pl-4 text-right">
            <p class="text-[10px] text-gray-400 mb-1">同期コード</p>
            <p class="text-lg font-mono font-bold tracking-widest text-blue-300">${state.familyCode}</p>
          </div>
        </div>
      `;
    }

    function renderHome() {
      const activeTasks = state.tasks.filter(t => ['open', 'accepted', 'completed', 'proposed'].includes(t.status));
      
      const gridButtons = state.role === 'child' ? `
        <button onclick="setView('propose')" class="btn-box text-xl aspect-[4/3] hover:bg-blue-50">見積り</button>
        <button onclick="setView('exchange')" class="btn-box text-xl aspect-[4/3] hover:bg-yellow-50">交換</button>
        <button onclick="setView('shop')" class="btn-box text-xl aspect-[4/3] hover:bg-pink-50">お店</button>
        <button onclick="setView('invest')" class="btn-box text-xl aspect-[4/3] hover:bg-green-50">かぶ</button>
      ` : `
        <button onclick="setView('taskCreate')" class="btn-box text-lg aspect-[4/3] hover:bg-blue-50">仕事追加</button>
        <button onclick="setView('exchange')" class="btn-box text-lg aspect-[4/3] hover:bg-yellow-50">交換承認</button>
        <button onclick="setView('shop')" class="btn-box text-lg aspect-[4/3] hover:bg-pink-50">お店管理</button>
        <button onclick="setView('invest')" class="btn-box text-lg aspect-[4/3] hover:bg-green-50">かぶ確認</button>
      `;

      return `
        <div class="flex flex-col md:flex-row gap-6 items-stretch">
          <div class="flex-1 flex flex-col gap-6">
            <div class="grid grid-cols-2 gap-4">
              ${gridButtons}
            </div>
            <div class="card-box p-3 h-full cursor-pointer hover:bg-gray-50 transition" onclick="setView('invest')">
              <h3 class="text-sm font-bold mb-1 border-b-2 border-black pb-1">過去半年のかぶ価</h3>
              <canvas id="investChart" height="200"></canvas>
            </div>
          </div>

          <div class="flex-1 card-box p-4 relative flex flex-col min-h-[350px]">
            <div class="flex justify-between items-end border-b-2 border-black pb-2 mb-3">
              <h2 class="text-2xl font-black">タスク</h2>
              <span class="text-sm font-bold">期日</span>
            </div>
            
            <div class="space-y-1 overflow-y-auto flex-1 pb-16">
              ${activeTasks.length > 0 ? activeTasks.map(t => {
                const timeLeft = formatTimeLeft(t.deadline);
                let actionBtn = '';
                if (state.role === 'child') {
                  if (t.status === 'open') actionBtn = `<button onclick="acceptTask('${t.id}')" class="text-xs bg-black text-white px-2 py-1 rounded font-bold ml-2 shrink-0">受注</button>`;
                  else if (t.status === 'accepted') actionBtn = `<button onclick="completeTask('${t.id}')" class="text-xs border-2 border-black px-2 py-1 rounded font-bold ml-2 shrink-0">完了</button>`;
                  else if (t.status === 'proposed') actionBtn = `<span class="text-[10px] text-gray-500 font-bold ml-2 shrink-0">親の確認待ち</span>`;
                  else actionBtn = `<span class="text-[10px] text-gray-500 font-bold ml-2 shrink-0">確認待ち</span>`;
                } else {
                  if (t.status === 'completed') actionBtn = `<button onclick="approveTask('${t.id}', ${t.points})" class="text-xs bg-blue-500 text-white px-2 py-1 rounded font-bold ml-2 shrink-0">pt付与</button>`;
                  else if (t.status === 'proposed') actionBtn = `<button onclick="approveProposal('${t.id}')" class="text-xs bg-black text-white px-2 py-1 rounded font-bold ml-2 shrink-0">承認</button>`;
                  else if (t.status === 'accepted') actionBtn = `<span class="text-[10px] text-gray-500 font-bold ml-2 shrink-0">子供が作業中</span>`;
                  else actionBtn = `<span class="text-[10px] text-gray-500 font-bold ml-2 shrink-0">未受注</span>`;
                }

                return `
                  <div class="flex items-center justify-between py-2 border-b border-dashed border-gray-300">
                    <div class="flex items-center min-w-0 mr-2 flex-1">
                      <span class="font-bold mr-1 shrink-0">・</span>
                      <span class="font-bold truncate text-sm flex-1">${t.title}</span>
                      <span class="text-gray-300 mx-1 hidden sm:inline shrink-0">--------</span>
                    </div>
                    <div class="flex items-center shrink-0">
                      <span class="text-sm font-bold w-[75px] text-right">${timeLeft}</span>
                      ${actionBtn}
                    </div>
                  </div>
                `;
              }).join('') : '<p class="text-center font-bold text-gray-400 mt-10">今できるタスクはないよ</p>'}
            </div>

            <button onclick="setView('${state.role === 'child' ? 'propose' : 'taskCreate'}')" class="absolute bottom-3 right-4 w-12 h-12 bg-blue-500 text-white rounded-full flex items-center justify-center text-3xl font-black shadow-lg hover:scale-110 transition-transform">
              ＋
            </button>
          </div>
        </div>
      `;
    }

    function renderPropose() {
      return `
        <div class="card-box p-6 max-w-md mx-auto relative">
          <button onclick="setView('home')" class="absolute top-4 right-4 font-bold text-xl">✕</button>
          <h2 class="text-xl font-black mb-4 border-b-2 border-black pb-2">親に見積りを出す</h2>
          <label class="block font-bold text-sm mb-1">これをやるよ！</label>
          <input type="text" id="prop-title" placeholder="おてつだいのなまえ" class="w-full p-3 border-2 border-black mb-4 font-bold rounded" />
          <label class="block font-bold text-sm mb-1">ほしいコイン数</label>
          <div class="flex items-center gap-2 mb-4">
            <input type="number" id="prop-points" placeholder="例: 100" class="w-1/2 p-3 border-2 border-black font-bold rounded" />
            <span class="font-bold">コイン</span>
          </div>
          <label class="block font-bold text-sm mb-1">いつまでにやる？ (期日)</label>
          <input type="datetime-local" id="prop-deadline" class="w-full p-3 border-2 border-black mb-6 font-bold rounded bg-gray-50" />
          <button onclick="proposeTask()" class="btn-box btn-primary w-full py-4 text-lg">提案を送る！</button>
        </div>
      `;
    }

    function renderTaskCreate() {
      return `
        <div class="card-box p-6 max-w-md mx-auto relative">
          <button onclick="setView('home')" class="absolute top-4 right-4 font-bold text-xl">✕</button>
          <h2 class="text-xl font-black mb-4 border-b-2 border-black pb-2">新しい仕事を依頼</h2>
          <input type="text" id="task-title" placeholder="仕事のタイトル" class="w-full p-3 border-2 border-black mb-4 font-bold rounded" />
          <div class="flex items-center gap-2 mb-4">
            <input type="number" id="task-points" placeholder="コイン数" class="w-1/2 p-3 border-2 border-black font-bold rounded" />
            <span class="font-bold">コイン</span>
          </div>
          <label class="block font-bold text-sm mb-1">いつまで？ (期日)</label>
          <input type="datetime-local" id="task-deadline" class="w-full p-3 border-2 border-black mb-6 font-bold rounded bg-gray-50" />
          <button onclick="addTask()" class="btn-box btn-primary w-full py-4 text-lg">依頼を追加する</button>
        </div>
      `;
    }

    function renderExchange() {
      const pendingExchanges = state.exchanges.filter(e => e.status === 'pending');
      if (state.role === 'child') {
        return `
          <div class="card-box p-6 max-w-md mx-auto relative">
            <button onclick="setView('home')" class="absolute top-4 right-4 font-bold text-xl">✕</button>
            <h2 class="text-xl font-black mb-2 border-b-2 border-black pb-2">💴 リアルおこづかい交換</h2>
            <p class="font-bold text-sm text-gray-600 mb-6">1コイン ＝ 1円 で現実のお金と交換できるよ！</p>
            <div class="flex items-center gap-3 mb-6">
              <input type="number" id="exchange-amount" placeholder="何円にする？" class="flex-1 p-4 border-2 border-black font-bold text-2xl rounded text-right" />
              <span class="font-black text-2xl">円</span>
            </div>
            <button onclick="requestExchange()" class="btn-box btn-yellow w-full py-4 text-lg mb-8">親に交換申請する！</button>
            ${pendingExchanges.length > 0 ? `
              <h3 class="font-bold mb-2">親の確認待ち</h3>
              <div class="space-y-2">
                ${pendingExchanges.map(e => `
                  <div class="border-2 border-black p-3 font-bold flex justify-between bg-gray-100 rounded">
                    <span>${e.yen} 円 に交換</span>
                    <span class="text-yellow-600">承認待ち</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      } else {
        return `
          <div class="card-box p-6 max-w-md mx-auto relative">
            <button onclick="setView('home')" class="absolute top-4 right-4 font-bold text-xl">✕</button>
            <h2 class="text-xl font-black mb-4 border-b-2 border-black pb-2">💴 子供からの交換申請</h2>
            ${pendingExchanges.length > 0 ? pendingExchanges.map(e => `
              <div class="border-2 border-black p-4 mb-4 rounded bg-yellow-50">
                <p class="font-black text-xl mb-1">${e.yen}円 を求めています</p>
                <p class="text-sm font-bold text-gray-500 mb-4">消費: ${e.points} コイン (1コイン=1円)</p>
                <div class="flex gap-2">
                  <button onclick="approveExchange('${e.id}', ${e.points})" class="flex-1 bg-black text-white py-3 rounded font-bold shadow-md hover:bg-gray-800">承認して渡す</button>
                  <button onclick="rejectExchange('${e.id}')" class="flex-1 bg-white border-2 border-black py-3 rounded font-bold hover:bg-gray-100">却下</button>
                </div>
              </div>
            `).join('') : '<p class="font-bold text-center text-gray-400 py-10">現在、申請はありません</p>'}
          </div>
        `;
      }
    }

    function renderShop() {
      const activeTickets = state.tickets.filter(t => t.status === 'available');
      if (state.role === 'child') {
        return `
          <div class="card-box p-6 max-w-lg mx-auto relative">
            <button onclick="setView('home')" class="absolute top-4 right-4 font-bold text-xl">✕</button>
            <h2 class="text-xl font-black mb-4 border-b-2 border-black pb-2">チケットのお店</h2>
            <div class="space-y-3">
              ${activeTickets.length > 0 ? activeTickets.map(t => `
                <div class="flex justify-between items-center p-4 border-2 border-black rounded bg-pink-50">
                  <div>
                    <p class="font-black text-lg">${t.title}</p>
                    <p class="text-sm font-bold text-pink-600">${t.price} コイン</p>
                  </div>
                  <button onclick="buyTicket('${t.id}', ${t.price})" class="btn-box bg-white px-4 py-2">交換する</button>
                </div>
              `).join('') : '<p class="font-bold text-gray-400 text-center py-6">売っているものがないよ</p>'}
            </div>
          </div>
        `;
      } else {
        return `
          <div class="card-box p-6 max-w-lg mx-auto relative">
            <button onclick="setView('home')" class="absolute top-4 right-4 font-bold text-xl">✕</button>
            <h2 class="text-xl font-black mb-4 border-b-2 border-black pb-2">お店の管理（販売リスト）</h2>
            <div class="flex gap-2 mb-4">
              <input type="text" id="ticket-title" placeholder="チケット名 (例: ゲーム30分)" class="flex-1 p-3 border-2 border-black font-bold rounded" />
              <input type="number" id="ticket-points" placeholder="コイン" class="w-24 p-3 border-2 border-black font-bold rounded" />
            </div>
            <button onclick="addTicket()" class="btn-box w-full bg-black text-white py-3 mb-6">お店に並べる</button>
            <h3 class="font-bold mb-2">販売中</h3>
            <div class="space-y-2">
              ${activeTickets.length > 0 ? activeTickets.map(t => `
                <div class="flex justify-between items-center p-3 border-2 border-black rounded bg-gray-50">
                  <span class="font-bold">${t.title} <span class="text-xs text-gray-500 ml-2">${t.price} コイン</span></span>
                  <button onclick="deleteTicket('${t.id}')" class="text-sm font-bold text-red-500 underline">やめる</button>
                </div>
              `).join('') : '<p class="text-sm font-bold text-gray-400">何も並んでいません</p>'}
            </div>
          </div>
        `;
      }
    }

    function renderTickets() {
      const boughtTickets = state.tickets.filter(t => t.status === 'bought');
      if (state.role === 'child') {
        return `
          <div class="card-box p-6 max-w-lg mx-auto">
            <h2 class="text-xl font-black mb-4 border-b-2 border-black pb-2">🎟️ 持ち物 (買ったチケット)</h2>
            <div class="space-y-3">
              ${boughtTickets.length > 0 ? boughtTickets.map(t => `
                <div class="flex justify-between items-center p-4 border-2 border-black rounded bg-[#111] text-white">
                  <span class="font-black text-lg">${t.title}</span>
                  <span class="text-xs font-bold px-3 py-1 bg-white text-black border-2 border-black rounded">親に見せて使う</span>
                </div>
              `).join('') : '<p class="font-bold text-gray-400 text-center py-10">チケットは持っていないよ</p>'}
            </div>
          </div>
        `;
      } else {
        return `
          <div class="card-box p-6 max-w-lg mx-auto">
            <h2 class="text-xl font-black mb-4 border-b-2 border-black pb-2">🎟️ 子供が持っているチケット</h2>
            <div class="space-y-3">
              ${boughtTickets.length > 0 ? boughtTickets.map(t => `
                <div class="flex justify-between items-center p-4 border-2 border-black rounded bg-gray-100">
                  <span class="font-bold">${t.title}</span>
                  <button onclick="useTicket('${t.id}')" class="btn-box bg-white px-3 py-2 text-sm">回収する (使用済)</button>
                </div>
              `).join('') : '<p class="font-bold text-gray-400 text-center py-10">持っているチケットはありません</p>'}
            </div>
          </div>
        `;
      }
    }

    // ★ 投資画面: 全体の余白を詰め、リストを横並び（グリッド）にして縦長になるのを防ぐ
    function renderInvest() {
      const rates = getMarketRates();
      return `
        <div class="card-box p-4 sm:p-6 max-w-2xl mx-auto relative">
          <button onclick="setView('home')" class="absolute top-4 right-4 font-bold text-xl">✕</button>
          <h2 class="text-xl font-black mb-3 border-b-2 border-black pb-2">📈 かぶ (投資)</h2>
          
          <div class="border-2 border-black p-2 mb-4 bg-gray-50 rounded">
            <canvas id="investChart" height="150"></canvas>
            <p class="text-xs text-gray-500 font-bold mt-1 text-center">※過去半年間の上がり下がり</p>
          </div>

          ${state.role === 'child' ? `
            <div class="mb-4 p-3 border-2 border-black rounded bg-white">
              <p class="font-bold text-sm mb-2">コインを投資する</p>
              <div class="flex gap-2 mb-2">
                <input type="number" id="invest-amount" placeholder="何コイン？" class="flex-1 p-2 border-2 border-black font-bold rounded" />
                <span class="p-2 font-bold text-sm flex items-center">コイン</span>
              </div>
              <div class="flex gap-2">
                <button onclick="investCustom('日本')" class="btn-box flex-1 py-2 text-sm text-blue-600 bg-blue-50">日本を買う</button>
                <button onclick="investCustom('アメリカ')" class="btn-box flex-1 py-2 text-sm text-red-600 bg-red-50">アメリカを買う</button>
              </div>
            </div>
          ` : ''}

          <h3 class="font-bold mb-2">現在持っている かぶ</h3>
          <!-- ★ リストを横並び (グリッド) にして高さを圧縮しました -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            ${state.investments.length > 0 ? state.investments.map(inv => {
              const currentRate = inv.name === '日本' ? rates.日本[12] : rates.アメリカ[12];
              const shares = inv.shares || (inv.investedPoints / currentRate);
              const currentValue = Math.round(shares * currentRate);
              const diff = currentValue - inv.investedPoints;
              const isUp = diff >= 0;
              return `
                <div class="flex flex-col p-3 border-2 border-black rounded ${isUp ? 'bg-red-50' : 'bg-blue-50'}">
                  <div class="flex justify-between items-start mb-1">
                    <p class="font-black text-lg leading-none">${inv.name}</p>
                    <p class="text-xs font-bold text-gray-500">投資: ${inv.investedPoints}</p>
                  </div>
                  <p class="text-sm font-black mb-3">価値: ${currentValue} コイン <span class="${isUp ? 'text-red-600' : 'text-blue-600'}">(${isUp ? '▲' : '▼'}${Math.abs(diff)})</span></p>
                  ${state.role === 'child' ? `<button onclick="sellCustom('${inv.id}', '${inv.name}', ${currentValue})" class="btn-box bg-white w-full py-1.5 text-sm mt-auto">売却してコインにする</button>` : ''}
                </div>
              `;
            }).join('') : '<p class="font-bold text-gray-400 border-2 border-black border-dashed p-4 text-center rounded sm:col-span-2">何も買っていません</p>'}
          </div>
        </div>
      `;
    }

    function renderHistory() {
      const approvedTasks = state.tasks.filter(t => t.status === 'approved');
      const totalEarned = approvedTasks.reduce((sum, t) => sum + t.points, 0);
      
      return `
        <div class="card-box p-6 max-w-lg mx-auto">
          <h2 class="text-xl font-black mb-4 border-b-2 border-black pb-2">🏆 これまでの りれき</h2>
          <div class="border-2 border-black bg-yellow-50 p-4 rounded text-center mb-6">
            <p class="text-sm font-bold text-yellow-800">これまで稼いだ合計</p>
            <p class="text-4xl font-black text-yellow-600 mt-2">${totalEarned.toLocaleString()} <span class="text-lg text-black">コイン</span></p>
          </div>
          
          <h3 class="font-bold mb-3">おわった仕事</h3>
          <div class="space-y-2 max-h-60 overflow-y-auto pr-2">
            ${approvedTasks.length > 0 ? approvedTasks.map(t => `
              <div class="flex justify-between font-bold text-sm border-b-2 border-gray-100 py-2">
                <span>${t.title}</span>
                <span class="text-gray-500">${t.points} コイン</span>
              </div>
            `).join('') : '<p class="text-sm font-bold text-gray-400">まだないよ</p>'}
          </div>
        </div>
      `;
    }

    function renderSettings() {
      return `
        <div class="card-box p-6 max-w-md mx-auto">
          <h2 class="text-xl font-black mb-4 border-b-2 border-black pb-2">⚙️ 設定</h2>
          <div class="p-4 border-2 border-black bg-gray-100 rounded mb-6 text-center">
            <p class="text-sm font-bold text-gray-500 mb-2">あなたの同期コード</p>
            <p class="text-3xl font-mono font-black tracking-widest text-blue-600">${state.familyCode}</p>
          </div>
          <button onclick="unlinkAccount()" class="btn-box w-full py-4 text-red-500 border-red-500 hover:bg-red-50">連携を解除して最初に戻る</button>
        </div>
      `;
    }

    function renderSetup() {
      appDiv.innerHTML = `
        <div class="fade-in max-w-sm mx-auto mt-10">
          <h1 class="text-4xl font-black text-center mb-10 tracking-tight">Chibiz</h1>
          <div class="card-box p-6 mb-6">
            <h3 class="font-black mb-4 border-b-2 border-black pb-2">親としてスタート</h3>
            <button id="btn-create-parent" class="btn-box btn-primary w-full py-3">同期コードを発行</button>
          </div>
          <div class="card-box p-6">
            <h3 class="font-black mb-4 border-b-2 border-black pb-2">子供としてスタート</h3>
            <input type="text" id="input-family-code" placeholder="コードを入力" class="w-full p-3 border-2 border-black rounded mb-4 text-center font-mono uppercase font-bold" />
            <button id="btn-join-child" class="btn-box w-full bg-yellow-300 py-3">連携して開始</button>
          </div>
        </div>
      `;

      document.getElementById('btn-create-parent').addEventListener('click', async () => {
        const code = Math.random().toString(36).substring(2, 8).toUpperCase();
        await setDoc(doc(db, "families", code), { points: 0 });
        localStorage.setItem('chibiz_role', 'parent'); localStorage.setItem('chibiz_familyCode', code);
        state.role = 'parent'; state.familyCode = code; state.view = 'home'; setupListeners();
      });

      document.getElementById('btn-join-child').addEventListener('click', async () => {
        const code = document.getElementById('input-family-code').value.toUpperCase().trim();
        if (!code) return;
        const docSnap = await getDoc(doc(db, "families", code));
        if (docSnap.exists()) {
          localStorage.setItem('chibiz_role', 'child'); localStorage.setItem('chibiz_familyCode', code);
          state.role = 'child'; state.familyCode = code; state.view = 'home'; setupListeners();
        } else alert("正しいコードが見つかりません。");
      });
    }

    // ★ Chart.js を使った「折れ線グラフ」の描画
    function drawInvestChart() {
      const canvas = document.getElementById('investChart');
      if (!canvas) return; 
      
      const rates = getMarketRates();
      const ctx = canvas.getContext('2d');

      const jpInv = state.investments.find(i => i.name === '日本');
      const amInv = state.investments.find(i => i.name === 'アメリカ');

      const jpShares = jpInv ? (jpInv.shares || (jpInv.investedPoints / rates.日本[12])) : 0;
      const amShares = amInv ? (amInv.shares || (amInv.investedPoints / rates.アメリカ[12])) : 0;

      const jpData = rates.日本.map(rate => Math.round(jpShares * rate));
      const amData = rates.アメリカ.map(rate => Math.round(amShares * rate));

      const showDemo = (!jpInv && !amInv);
      const datasetJp = showDemo ? rates.日本.map(r => Math.round(100 * r)) : jpData;
      const datasetAm = showDemo ? rates.アメリカ.map(r => Math.round(100 * r)) : amData;

      if (investChartInstance) investChartInstance.destroy(); 

      investChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: rates.labels,
          datasets: [
            {
              label: showDemo ? '日本 (参考:100コイン)' : '日本の資産価値',
              data: datasetJp,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59, 130, 246, 0.1)',
              borderWidth: 3,
              tension: 0.4,
              fill: true,
              pointRadius: 0
            },
            {
              label: showDemo ? 'アメリカ (参考:100コイン)' : 'アメリカの資産価値',
              data: datasetAm,
              borderColor: '#ef4444',
              backgroundColor: 'rgba(239, 68, 68, 0.1)',
              borderWidth: 3,
              tension: 0.4,
              fill: true,
              pointRadius: 0
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: { duration: 800, easing: 'easeOutQuart' },
          plugins: { legend: { labels: { font: { family: 'sans-serif', weight: 'bold' } } } },
          scales: {
            x: { grid: { display: false }, ticks: { font: { weight: 'bold' } } },
            y: { grid: { color: '#e5e7eb' }, ticks: { font: { weight: 'bold' } } }
          }
        }
      });
    }

    window.unlinkAccount = () => { if (confirm("連携を解除しますか？")) { localStorage.clear(); window.location.reload(); } };

    window.addTask = async () => {
      const title = document.getElementById('task-title').value.trim();
      const points = parseInt(document.getElementById('task-points').value);
      const dlVal = document.getElementById('task-deadline').value;
      const deadline = dlVal ? new Date(dlVal).getTime() : null;
      if (!title || !points || points <= 0) return alert("タイトルとコインを正しく入力してください");
      
      await addDoc(collection(db, "tasks"), { familyCode: state.familyCode, title, points, deadline, status: 'open', createdAt: Date.now() });
      setView('home');
    };

    window.proposeTask = async () => {
      const title = document.getElementById('prop-title').value.trim();
      const points = parseInt(document.getElementById('prop-points').value);
      const dlVal = document.getElementById('prop-deadline').value;
      const deadline = dlVal ? new Date(dlVal).getTime() : null;
      if (!title || !points || points <= 0) return alert("タイトルとコインを正しく入力してね");

      await addDoc(collection(db, "tasks"), { familyCode: state.familyCode, title, points, deadline, status: 'proposed', createdAt: Date.now() });
      alert("親に提案を送りました！");
      setView('home');
    };

    window.approveTask = async (id, points) => { await updateDoc(doc(db, "tasks", id), { status: 'approved' }); await updateDoc(doc(db, "families", state.familyCode), { points: increment(points) }); };
    window.approveProposal = async (id) => updateDoc(doc(db, "tasks", id), { status: 'open' });
    window.acceptTask = async (id) => updateDoc(doc(db, "tasks", id), { status: 'accepted' });
    window.completeTask = async (id) => updateDoc(doc(db, "tasks", id), { status: 'completed' });

    window.addTicket = async () => {
      const title = document.getElementById('ticket-title').value.trim();
      const price = parseInt(document.getElementById('ticket-points').value);
      if (title && price > 0) {
        await addDoc(collection(db, "tickets"), { familyCode: state.familyCode, title, price, status: 'available', createdAt: Date.now() });
        document.getElementById('ticket-title').value = '';
        document.getElementById('ticket-points').value = '';
      }
    };
    window.deleteTicket = async (id) => deleteDoc(doc(db, "tickets", id));
    window.buyTicket = async (id, price) => {
      if (state.points < price) return alert("コインが足りないよ！");
      await updateDoc(doc(db, "tickets", id), { status: 'bought' });
      await updateDoc(doc(db, "families", state.familyCode), { points: increment(-price) });
    };
    window.useTicket = async (id) => updateDoc(doc(db, "tickets", id), { status: 'used' });

    window.investCustom = async (name) => {
      const amount = parseInt(document.getElementById('invest-amount').value);
      if (!amount || amount <= 0) return alert("投資するコインを正しく入力してね");
      if (state.points < amount) return alert("コインが足りないよ！");
      
      const rates = getMarketRates();
      const currentRate = name === '日本' ? rates.日本[12] : rates.アメリカ[12];

      if (confirm(`【${name}】に ${amount}コイン を投資する？\n（コインが減り、投資に回ります）`)) {
        await updateDoc(doc(db, "families", state.familyCode), { points: increment(-amount) });
        
        const existingInv = state.investments.find(inv => inv.name === name);
        if (existingInv) {
          const newShares = amount / currentRate;
          await updateDoc(doc(db, "investments", existingInv.id), { 
            investedPoints: increment(amount),
            shares: increment(newShares)
          });
        } else {
          const shares = amount / currentRate;
          await addDoc(collection(db, "investments"), { familyCode: state.familyCode, name: name, investedPoints: amount, shares: shares, createdAt: Date.now() });
        }
        alert("投資が完了したよ！");
        document.getElementById('invest-amount').value = '';
      }
    };

    window.sellCustom = async (id, name, currentValue) => {
      if (confirm(`【${name}】の投資を終了して、『${currentValue}コイン』を受け取る？`)) {
        await updateDoc(doc(db, "families", state.familyCode), { points: increment(currentValue) });
        await deleteDoc(doc(db, "investments", id));
        alert(`${currentValue}コイン を受け取ったよ！`);
      }
    };

    window.requestExchange = async () => {
      const amount = parseInt(document.getElementById('exchange-amount').value);
      if (!amount || amount <= 0) return alert("正しく入力してね");
      if (state.points < amount) return alert("コインが足りないよ！");
      
      if (confirm(`${amount}コインを使って、親に${amount}円の交換を申請する？`)) {
        await addDoc(collection(db, "exchanges"), {
          familyCode: state.familyCode,
          points: amount,
          yen: amount,
          status: 'pending',
          createdAt: Date.now()
        });
        alert("親に申請を送ったよ！");
        setView('home');
      }
    };

    window.approveExchange = async (id, points) => {
      if (state.points < points) return alert(`子供のコインが ${points} に満たないため承認できません`);
      if (confirm(`本当に渡しますか？\n（子供のコインが ${points} 引かれます）`)) {
        await updateDoc(doc(db, "families", state.familyCode), { points: increment(-points) });
        await updateDoc(doc(db, "exchanges", id), { status: 'approved' });
        alert("承認しました！現実で現金を渡してあげてください。");
      }
    };
    window.rejectExchange = async (id) => {
      if (confirm("この申請を却下しますか？")) { await updateDoc(doc(db, "exchanges", id), { status: 'rejected' }); }
    };

    function setupListeners() {
      if (!state.familyCode) return;
      onSnapshot(doc(db, "families", state.familyCode), (doc) => {
        if (doc.exists()) { state.points = doc.data().points || 0; render(); }
      });
      const watch = (colName, stateKey) => {
        const q = query(collection(db, colName), where("familyCode", "==", state.familyCode));
        onSnapshot(q, (snapshot) => {
          const arr = []; snapshot.forEach(d => arr.push({ id: d.id, ...d.data() }));
          arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          state[stateKey] = arr; render();
        });
      };
      watch("tasks", "tasks");
      watch("tickets", "tickets");
      watch("investments", "investments");
      watch("exchanges", "exchanges");
    }

    if (state.familyCode) setupListeners(); else render();
  </script>
</body>
</html>
