<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no">
  <title>紙にトレース</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0d12">
  <style>
    :root {
      --ink: #e8edf4;
      --muted: #9aa6b8;
      --panel: rgba(12, 16, 24, 0.78);
      --line: rgba(255, 255, 255, 0.12);
      --accent: #7dd3c0;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      background: #0b0d12;
      color: var(--ink);
      font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    button, input { font-family: inherit; }

    /* ---- スタート ---- */
    #start {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px calc(32px + var(--safe-b));
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(125, 211, 192, 0.18), transparent 55%),
        radial-gradient(800px 500px at 100% 100%, rgba(90, 120, 200, 0.16), transparent 50%),
        #0b0d12;
    }

    #start.hidden { display: none; }

    .mark {
      width: 88px;
      height: 88px;
      border-radius: 28px;
      background: linear-gradient(160deg, #1a2433, #10151e);
      border: 1px solid var(--line);
      display: grid;
      place-items: center;
      margin-bottom: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0.04em;
      font-weight: 800;
    }

    .lead {
      margin: 0 0 36px;
      color: var(--muted);
      text-align: center;
      line-height: 1.7;
      font-size: 14px;
      max-width: 280px;
    }

    .pick {
      appearance: none;
      border: 0;
      border-radius: 999px;
      padding: 16px 28px;
      font-size: 16px;
      font-weight: 800;
      color: #0b0d12;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(125, 211, 192, 0.28);
    }

    .pick:active { transform: scale(0.98); }

    #file { display: none; }

    /* ---- スタジオ ---- */
    #studio {
      position: fixed;
      inset: 0;
      display: none;
      background: #000;
    }

    #studio.on { display: block; }

    #cam {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    #overlay-layer {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    #overlay-layer.locked { pointer-events: none; }

    #overlay {
      max-width: min(86vw, 720px);
      max-height: 72vh;
      width: auto;
      height: auto;
      object-fit: contain;
      transform-origin: center center;
      will-change: transform, opacity;
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.35));
    }

    /* ---- 操作パネル ---- */
    #chrome {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    #chrome.hidden { opacity: 0; }

    .bar {
      pointer-events: auto;
      position: absolute;
      left: 12px;
      right: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .bar.top {
      top: calc(10px + var(--safe-t));
      justify-content: space-between;
    }

    .bar.bottom {
      bottom: calc(12px + var(--safe-b));
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }

    .glass {
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .icon-btn, .chip {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 14px;
      height: 44px;
      min-width: 44px;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .icon-btn { display: grid; place-items: center; padding: 0; }

    .panel {
      border-radius: 20px;
      padding: 14px 16px 12px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 32px;
    }

    .row + .row { margin-top: 8px; }

    .label {
      width: 64px;
      flex: none;
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .value {
      width: 42px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
    }

    input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      height: 28px;
    }

    .tools {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .tools::-webkit-scrollbar { display: none; }

    .chip.active {
      background: var(--accent);
      color: #0b0d12;
      border-color: transparent;
    }

    #hint {
      position: absolute;
      left: 50%;
      top: 46%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      color: rgba(255, 255, 255, 0.7);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-shadow: 0 2px 12px #000;
      opacity: 0;
      transition: opacity 0.4s;
    }

    #hint.show { opacity: 1; }

    #error {
      display: none;
      margin-top: 16px;
      color: #ffb4b4;
      font-size: 13px;
      text-align: center;
      max-width: 280px;
      line-height: 1.6;
    }

    #error.on { display: block; }
  </style>
</head>
<body>
  <section id="start">
    <div class="mark" aria-hidden="true">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none">
        <rect x="7" y="10" width="22" height="28" rx="3" stroke="#7dd3c0" stroke-width="2"/>
        <rect x="15" y="6" width="22" height="28" rx="3" fill="#15202c" stroke="#e8edf4" stroke-width="2" opacity="0.9"/>
        <path d="M21 18l4 5 3-3 5 7H19l2-9z" fill="#7dd3c0"/>
      </svg>
    </div>
    <h1>紙にトレース</h1>
    <p class="lead">画像を半透明で重ねて、画面の向こうの紙に絵を描けます。透明度はあとから変えられます。</p>
    <button class="pick" id="pick-btn" type="button">画像を挿入</button>
    <p id="error"></p>
    <input id="file" type="file" accept="image/*">
  </section>

  <section id="studio">
    <video id="cam" autoplay playsinline muted></video>
    <div id="overlay-layer">
      <img id="overlay" alt="トレース用の画像">
    </div>
    <p id="hint">画面を通して紙に描いてください</p>
    <div id="chrome">
      <div class="bar top">
        <button class="icon-btn" id="back-btn" type="button" aria-label="もどる">←</button>
        <button class="chip" id="lock-btn" type="button">ロック解除中</button>
        <button class="icon-btn" id="hide-btn" type="button" aria-label="操作を隠す">隠</button>
      </div>
      <div class="bar bottom">
        <div class="glass panel">
          <div class="row">
            <span class="label">透明度</span>
            <input id="opacity" type="range" min="5" max="90" value="42">
            <span class="value" id="opacity-val">42%</span>
          </div>
          <div class="row">
            <span class="label">大きさ</span>
            <input id="scale" type="range" min="20" max="280" value="100">
            <span class="value" id="scale-val">100%</span>
          </div>
          <div class="row">
            <span class="label">回転</span>
            <input id="rotate" type="range" min="-180" max="180" value="0">
            <span class="value" id="rotate-val">0°</span>
          </div>
        </div>
        <div class="tools">
          <button class="chip" id="flip-h" type="button">左右反転</button>
          <button class="chip" id="flip-v" type="button">上下反転</button>
          <button class="chip" id="cam-btn" type="button">カメラ切替</button>
          <button class="chip" id="reset-btn" type="button">位置リセット</button>
          <button class="chip" id="repick-btn" type="button">画像を変更</button>
        </div>
      </div>
    </div>
  </section>

  <script>
    const startEl = document.getElementById('start');
    const studioEl = document.getElementById('studio');
    const fileEl = document.getElementById('file');
    const overlay = document.getElementById('overlay');
    const layer = document.getElementById('overlay-layer');
    const cam = document.getElementById('cam');
    const chrome = document.getElementById('chrome');
    const hint = document.getElementById('hint');
    const errorEl = document.getElementById('error');
    const lockBtn = document.getElementById('lock-btn');

    const t = {
      x: 0,
      y: 0,
      scale: 1,
      rotate: 0,
      opacity: 0.42,
      flipH: 1,
      flipV: 1,
      locked: false,
      facing: 'environment'
    };

    let stream = null;
    let objectUrl = null;
    let hintTimer = null;

    function applyTransform() {
      overlay.style.opacity = String(t.opacity);
      overlay.style.transform =
        `translate(${t.x}px, ${t.y}px) rotate(${t.rotate}deg) scale(${t.scale * t.flipH}, ${t.scale * t.flipV})`;
    }

    function showError(msg) {
      errorEl.textContent = msg;
      errorEl.classList.toggle('on', Boolean(msg));
    }

    async function startCamera() {
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
      }
      const tryConstraints = [
        { video: { facingMode: { ideal: t.facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false },
        { video: { facingMode: t.facing }, audio: false },
        { video: true, audio: false }
      ];
      let lastError = null;
      for (const constraints of tryConstraints) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          cam.srcObject = stream;
          await cam.play();
          return;
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error('カメラを起動できませんでした');
    }

    async function openStudio(file) {
      if (objectUrl) URL.revokeObjectURL(objectUrl);
      objectUrl = URL.createObjectURL(file);
      overlay.src = objectUrl;
      t.x = 0;
      t.y = 0;
      t.scale = 1;
      t.rotate = 0;
      t.flipH = 1;
      t.flipV = 1;
      document.getElementById('scale').value = '100';
      document.getElementById('rotate').value = '0';
      document.getElementById('scale-val').textContent = '100%';
      document.getElementById('rotate-val').textContent = '0°';
      applyTransform();

      try {
        await startCamera();
        showError('');
      } catch (err) {
        console.error(err);
        showError('カメラを起動できませんでした。ブラウザの許可を確認してください。');
        return;
      }

      startEl.classList.add('hidden');
      studioEl.classList.add('on');
      chrome.classList.remove('hidden');
      hint.classList.add('show');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => hint.classList.remove('show'), 2400);
    }

    document.getElementById('pick-btn').addEventListener('click', () => fileEl.click());
    document.getElementById('repick-btn').addEventListener('click', () => fileEl.click());

    fileEl.addEventListener('change', (event) => {
      const file = event.target.files && event.target.files[0];
      event.target.value = '';
      if (!file) return;
      openStudio(file);
    });

    document.getElementById('opacity').addEventListener('input', (event) => {
      t.opacity = Number(event.target.value) / 100;
      document.getElementById('opacity-val').textContent = `${event.target.value}%`;
      applyTransform();
    });

    document.getElementById('scale').addEventListener('input', (event) => {
      t.scale = Number(event.target.value) / 100;
      document.getElementById('scale-val').textContent = `${event.target.value}%`;
      applyTransform();
    });

    document.getElementById('rotate').addEventListener('input', (event) => {
      t.rotate = Number(event.target.value);
      document.getElementById('rotate-val').textContent = `${event.target.value}°`;
      applyTransform();
    });

    document.getElementById('flip-h').addEventListener('click', (event) => {
      t.flipH *= -1;
      event.currentTarget.classList.toggle('active', t.flipH < 0);
      applyTransform();
    });

    document.getElementById('flip-v').addEventListener('click', (event) => {
      t.flipV *= -1;
      event.currentTarget.classList.toggle('active', t.flipV < 0);
      applyTransform();
    });

    document.getElementById('cam-btn').addEventListener('click', async () => {
      t.facing = t.facing === 'environment' ? 'user' : 'environment';
      try {
        await startCamera();
      } catch (err) {
        console.error(err);
      }
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      t.x = 0;
      t.y = 0;
      t.scale = 1;
      t.rotate = 0;
      document.getElementById('scale').value = '100';
      document.getElementById('rotate').value = '0';
      document.getElementById('scale-val').textContent = '100%';
      document.getElementById('rotate-val').textContent = '0°';
      applyTransform();
    });

    function setLocked(locked) {
      t.locked = locked;
      layer.classList.toggle('locked', locked);
      lockBtn.textContent = locked ? 'ロック中' : 'ロック解除中';
      lockBtn.classList.toggle('active', locked);
    }

    lockBtn.addEventListener('click', () => setLocked(!t.locked));

    document.getElementById('hide-btn').addEventListener('click', () => {
      chrome.classList.add('hidden');
      hint.classList.remove('show');
    });

    studioEl.addEventListener('click', (event) => {
      if (chrome.classList.contains('hidden') && event.target !== overlay) {
        chrome.classList.remove('hidden');
      }
    });

    document.getElementById('back-btn').addEventListener('click', () => {
      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
        stream = null;
      }
      cam.srcObject = null;
      studioEl.classList.remove('on');
      startEl.classList.remove('hidden');
    });

    /* 1本指で移動、2本指で拡大 */
    const pointers = new Map();
    let gesture = null;

    function pointerDistance(a, b) {
      const dx = a.x - b.x;
      const dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    layer.addEventListener('pointerdown', (event) => {
      if (t.locked) return;
      layer.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (pointers.size === 1) {
        gesture = { mode: 'drag', x: t.x, y: t.y, px: event.clientX, py: event.clientY };
      } else if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        gesture = {
          mode: 'pinch',
          dist: pointerDistance(a, b),
          scale: t.scale
        };
      }
    });

    layer.addEventListener('pointermove', (event) => {
      if (!pointers.has(event.pointerId) || !gesture) return;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
      if (gesture.mode === 'drag' && pointers.size === 1) {
        t.x = gesture.x + (event.clientX - gesture.px);
        t.y = gesture.y + (event.clientY - gesture.py);
        applyTransform();
      } else if (gesture.mode === 'pinch' && pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const dist = pointerDistance(a, b);
        t.scale = Math.min(2.8, Math.max(0.2, gesture.scale * (dist / gesture.dist)));
        document.getElementById('scale').value = String(Math.round(t.scale * 100));
        document.getElementById('scale-val').textContent = `${Math.round(t.scale * 100)}%`;
        applyTransform();
      }
    });

    function endPointer(event) {
      pointers.delete(event.pointerId);
      if (pointers.size === 0) gesture = null;
    }

    layer.addEventListener('pointerup', endPointer);
    layer.addEventListener('pointercancel', endPointer);

    applyTransform();
  </script>
</body>
</html>
